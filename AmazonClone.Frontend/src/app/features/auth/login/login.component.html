<div class="auth-page container">
  <div class="auth-card glass-panel">
    <!-- Header -->
    <div class="auth-header">
      <a routerLink="/" class="auth-logo">
        amazon<span class="logo-domain">.enterprise</span>
      </a>
      <h2>Sign in to your Account</h2>
      <p class="subtitle">Enter your email and password to access your personalized catalog, shopping cart, and
        wishlist.</p>
    </div>

    <!-- Success Message from Registration -->
    <div class="alert-banner alert-success" *ngIf="successMessage()">
      <lucide-icon [name]="ShieldCheckIcon" class="alert-icon"></lucide-icon>
      <span>{{ successMessage() }}</span>
    </div>

    <!-- Error Banner -->
    <div class="alert-banner alert-error" *ngIf="authStore.error()">
      <lucide-icon [name]="AlertIcon" class="alert-icon"></lucide-icon>
      <span>{{ authStore.error() }}</span>
    </div>

    <!-- Form -->
    <form (ngSubmit)="onSubmit()" class="auth-form">
      <!-- Email Field -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <lucide-icon [name]="MailIcon" class="input-icon"></lucide-icon>
          <input type="email" id="email" placeholder="name@enterprise.com" [ngModel]="email()"
            (ngModelChange)="email.set($event)" name="email" required autocomplete="email" />
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <div class="label-row">
          <label for="password">Password</label>
          <a routerLink="/forgot-password" class="forgot-link">Forgot password?</a>
        </div>
        <div class="input-wrapper">
          <lucide-icon [name]="LockIcon" class="input-icon"></lucide-icon>
          <input type="password" id="password" placeholder="••••••••••••" [ngModel]="password()"
            (ngModelChange)="password.set($event)" name="password" required autocomplete="current-password" />
        </div>
      </div>

      <!-- Submit CTA -->
      <button type="submit" class="btn-primary auth-submit" [disabled]="authStore.loading() || !email() || !password()">
        <span *ngIf="!authStore.loading()">Sign In</span>
        <span *ngIf="authStore.loading()" class="spinner">Signing in...</span>
        <lucide-icon [name]="ArrowRightIcon" class="btn-icon" *ngIf="!authStore.loading()"></lucide-icon>
      </button>
    </form>

    <!-- Divider -->
    <div class="divider">
      <span>or continue with</span>
    </div>

    <!-- Google OAuth 2.0 CTA -->
    <div class="google-section">
      <button type="button" class="btn-google" (click)="onGoogleSignIn()" [disabled]="authStore.loading()">
        <svg class="google-svg" viewBox="0 0 24 24">
          <path fill="#4285F4"
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
          <path fill="#34A853"
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
          <path fill="#FBBC05"
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
          <path fill="#EA4335"
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
        </svg>
        <span>Continue with Google OAuth</span>
      </button>

      <div class="google-token-input" *ngIf="showGoogleInput()">
        <input type="text" placeholder="Paste Google JWT idToken for local verification..." [ngModel]="googleIdToken()"
          (ngModelChange)="googleIdToken.set($event)" class="idtoken-box" />
        <button class="btn-primary btn-sm" (click)="onGoogleSignIn()" [disabled]="!googleIdToken()">Verify &
          Login</button>
      </div>
    </div>

    <!-- Footer Links -->
    <div class="auth-footer">
      <span>New to Amazon Enterprise?</span>
      <a routerLink="/register" class="register-link">Create your Amazon account</a>
    </div>
  </div>
</div>
