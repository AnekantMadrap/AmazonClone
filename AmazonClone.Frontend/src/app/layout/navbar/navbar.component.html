<header class="amazon-navbar">
  <div class="navbar-top container">
    <div class="nav-group nav-group-brand">
      <a routerLink="/home" class="navbar-brand">
        <span class="logo-text">amazon<span class="logo-domain">.enterprise</span></span>
      </a>

      <div class="navbar-location">
        <a routerLink="/addresses">
          <lucide-icon [name]="PinIcon" class="location-icon"></lucide-icon>
          <div class="location-text">
            <span class="location-sub">Deliver to</span>
            <span class="location-main">{{ addresses() }}</span>
          </div>
        </a>
      </div>
    </div>

    <div class="navbar-search">
      <div class="search-box">
        <select class="search-category" aria-label="Search category">
          <option>All</option>
        </select>
        <input type="text" placeholder="Search Amazon Enterprise" [ngModel]="searchQuery()"
          (ngModelChange)="onSearchInput($event)" (keydown.enter)="submitSearch()" class="search-input" />
        <button class="search-btn" (click)="submitSearch()" aria-label="Search">
          <lucide-icon [name]="SearchIcon"></lucide-icon>
        </button>
      </div>

      <div class="autocomplete-dropdown glass-panel" *ngIf="showSuggestions() && suggestions().length > 0">
        <div class="suggestion-item" *ngFor="let item of suggestions()" (click)="selectSuggestion(item)">
          <lucide-icon [name]="SearchIcon" class="suggestion-icon"></lucide-icon>
          <span>{{ item }}</span>
        </div>
      </div>
    </div>

    <div class="nav-group nav-group-actions">
      <a [routerLink]="authStore.isAuthenticated() ? '/profile' : '/login'" class="navbar-link account-link">
        <span class="link-sub">Hello, {{ userDisplayName() }}</span>
        <span class="link-main">Account & Lists</span>
      </a>

      <a routerLink="/search" class="navbar-link returns-link">
        <span class="link-sub">Returns</span>
        <span class="link-main">& Orders</span>
      </a>

      <a routerLink="/wishlist" class="navbar-link wishlist-link" aria-label="Wish List">
        <div class="icon-badge-wrapper">
          <lucide-icon [name]="HeartIcon" class="nav-icon"></lucide-icon>
          <span class="badge" *ngIf="wishlistCount() > 0">{{ wishlistCount() }}</span>
        </div>
        <span class="link-main hidden-sm">Wishlist</span>
      </a>

      <a routerLink="/cart" class="navbar-link cart-link" aria-label="Shopping Cart">
        <div class="icon-badge-wrapper">
          <lucide-icon [name]="CartIcon" class="nav-icon cart-icon-lg"></lucide-icon>
          <span class="badge cart-badge">{{ cartItemCount() }}</span>
        </div>
        <span class="link-main hidden-sm cart-label">Cart</span>
      </a>
    </div>
  </div>

  <div class="navbar-bottom">
    <div class="container bottom-links">
      <a routerLink="/home" class="bottom-link"><lucide-icon [name]="MenuIcon" class="menu-icon"></lucide-icon> All</a>
      <a routerLink="/search" [queryParams]="{ sortBy: 'popularity' }" class="bottom-link">Best Sellers</a>
      <a routerLink="/search" [queryParams]="{ sortBy: 'newest' }" class="bottom-link">New Releases</a>
      <a routerLink="/wishlist" class="bottom-link">Customer Wish List</a>
      <a routerLink="/search" class="bottom-link">Prime Delivery</a>
      <a routerLink="/search" class="bottom-link">Enterprise Store</a>
    </div>
  </div>
</header>
